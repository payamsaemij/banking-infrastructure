
services:
  postgres:
    image: postgres:17
    container_name: banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Per-service databases/roles, created only when the volume is first
      # initialized (see postgres/init/01-create-service-databases.sql).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - banking

volumes:
  postgres_data:

# The one shared Docker network for the whole local banking environment.
# This project creates and owns it; banking-identity and banking-accounts
# join it as an EXTERNAL network (fixed name, no compose-generated
# "<project>_default" dependency) to reach this PostgreSQL by the DNS
# name `banking-postgres:5432`.
networks:
  banking:
    name: banking
